    // --- GEOLOCATION UTILS ---
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      if(lat1==null || lon1==null || lat2==null || lon2==null) return 0;
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function generatePresetTrainingData() {
      const data = [];
      for (let i = 0; i < 150; i++) {
        const distance_km = Math.random() * 48 + 2;
        const speed_kmh = Math.random() * 95 + 5;
        const hour = Math.floor(Math.random() * 24);
        let base_time_min = (distance_km / speed_kmh) * 60;

        if (speed_kmh < 15) {
          base_time_min += (distance_km * 2.2) + Math.random() * 6;
        } else if (speed_kmh < 40) {
          base_time_min += (distance_km * 0.8) + Math.random() * 4;
        } else if (speed_kmh < 70) {
          base_time_min += (distance_km * 0.2) + Math.random() * 2;
        }

        if ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19)) {
          base_time_min *= (1.15 + (Math.random() * 0.25));
        }

        base_time_min += (Math.random() - 0.3) * 1.5;
        data.push({
          distance_km: Math.round(distance_km * 100) / 100,
          speed_kmh: Math.round(speed_kmh * 10) / 10,
          hour,
          actual_time_min: Math.max(1, Math.round(base_time_min * 10) / 10),
        });
      }
      return data;
    }

    // --- SUPABASE LOCAL WRAPPER SERVICE ---
    class DatabaseWrapper {
      constructor() {
        this.client = null;
        this.isConnected = false;
        this.url = localStorage.getItem("eta_supabase_url") || "";
        this.anonKey = localStorage.getItem("eta_supabase_key") || "";
        
        this.localLogs = JSON.parse(localStorage.getItem("eta_local_logs") || "[]");
        this.localTrainingData = JSON.parse(localStorage.getItem("eta_local_training") || "[]");

        if (this.localTrainingData.length === 0) {
          this.localTrainingData = generatePresetTrainingData();
          localStorage.setItem("eta_local_training", JSON.stringify(this.localTrainingData));
        }

        if (this.url && this.anonKey && window.supabase) {
          try {
            this.client = window.supabase.createClient(this.url, this.anonKey);
            this.isConnected = true;
          } catch (e) { console.error("Supabase fail", e); }
        }
      }

      async connect(url, anonKey) {
        if (!url || !anonKey) {
          return { success: false, message: "URLとAPIキーを入力してください。" };
        }
        try {
          if (!this.client) {
            this.client = window.supabase.createClient(url, anonKey);
          }
          const { error } = await this.client.from("gps_logs").select("*").limit(1);
          if (error) return { success: false, message: `DBアクセス拒否: ${error.message}` };

          this.url = url; this.anonKey = anonKey; this.isConnected = true;
          try {
            localStorage.setItem("eta_supabase_url", url);
            localStorage.setItem("eta_supabase_key", anonKey);
          } catch (storageErr) {}
          return { success: true, message: "Supabaseと接続＆自動同期を開始しました！" };
        } catch (e) {
          return { success: false, message: `通信時エラー: ${e.message || e}` };
        }
      }

      async addGPSLog(log) {
        const newLog = {
          id: Math.random().toString(36).substr(2, 9),
          created_at: new Date().toISOString(),
          ...log
        };
        this.localLogs.unshift(newLog);
        if (this.localLogs.length > 200) this.localLogs.pop();
        localStorage.setItem("eta_local_logs", JSON.stringify(this.localLogs));

        if (this.isConnected && this.client) {
          try {
            await this.client.from("gps_logs").insert([{
              latitude: Math.round(log.latitude * 1000000),
              longitude: Math.round(log.longitude * 1000000),
              speed: Math.round(log.speed_kmh * 100),
              device_id: log.device_id || "BUS-JT-9024"
            }]);
          } catch (err) { }
        }
        return newLog;
      }

      async getLatestGPSLog(deviceId) {
        if (!this.client || !deviceId) return null;
        try {
          const { data, error } = await this.client.from("gps_logs")
            .select("*").eq("device_id", deviceId).order("created_at", { ascending: false }).limit(1);
          
          if (data && data.length > 0) {
            const r = data[0];
            return {
              id: r.id,
              created_at: r.created_at,
              measured_at: r.measured_at,
              latitude: r.latitude > 180 ? r.latitude / 1000000 : r.latitude,
              longitude: r.longitude > 180 ? r.longitude / 1000000 : r.longitude,
              speed_kmh: r.speed ? r.speed / 100 : 0
            };
          }
        } catch (e) { console.error(e); }
        return null;
      }

      async addTrainingData(item) {
        this.localTrainingData.unshift(item);
        localStorage.setItem("eta_local_training", JSON.stringify(this.localTrainingData));
      }

      async getTrainingDatas() {
        return this.localTrainingData;
      }

      resetLocalData() {
        this.localLogs = [];
        this.localTrainingData = generatePresetTrainingData();
        localStorage.setItem("eta_local_logs", JSON.stringify(this.localLogs));
        localStorage.setItem("eta_local_training", JSON.stringify(this.localTrainingData));
      }
    }
    const dbService = new DatabaseWrapper();

    // --- TENSORFLOW LOCAL AI ENGINE MODEL (Phase 5 restored) ---
    class ETAInferenceModel {
      constructor() {
        this.model = null;
        this.isTraining = false;
        this.scaleDistMax = 60;
        this.scaleSpeedMax = 120;
        this.scaleHourMax = 24;
        this.scaleTimeMax = 120;
        this.buildModel();
      }

      buildModel() {
        const model = tf.sequential();
        model.add(tf.layers.dense({ inputShape: [3], units: 16, activation: "relu" }));
        model.add(tf.layers.dense({ units: 8, activation: "relu" }));
        model.add(tf.layers.dense({ units: 1 }));
        this.model = model;
      }

      async train(data, epochs, learningRate, onEpochEnd) {
        this.isTraining = true;
        const inputs = [];
        const labels = [];

        data.forEach(item => {
          inputs.push([
            Math.min(item.distance_km / this.scaleDistMax, 1.0),
            Math.min(item.speed_kmh / this.scaleSpeedMax, 1.0),
            item.hour / this.scaleHourMax
          ]);
          labels.push([Math.min(item.actual_time_min / this.scaleTimeMax, 1.0)]);
        });

        const xs = tf.tensor2d(inputs);
        const ys = tf.tensor2d(labels);

        const optimizer = tf.train.adam(learningRate);
        this.model.compile({ optimizer, loss: "meanSquaredError" });

        try {
          await this.model.fit(xs, ys, {
            epochs,
            batchSize: 16,
            shuffle: true,
            callbacks: {
              onEpochEnd: async (epoch, logs) => {
                if (logs && logs.loss !== undefined) {
                  onEpochEnd(epoch + 1, logs.loss);
                }
              }
            }
          });
        } finally {
          xs.dispose();
          ys.dispose();
          this.isTraining = false;
        }
      }

      predict(distanceKm, speedKmh, hour) {
        const startTime = performance.now();
        const fallbackSpeed = Math.max(1, speedKmh);
        const physicalMinutes = (distanceKm / fallbackSpeed) * 60;

        if (!this.model || this.isTraining) {
          return {
            predictedMinutes: Math.round(physicalMinutes * 10) / 10,
            inferenceTimeMs: Math.round((performance.now() - startTime) * 10) / 10,
          };
        }

        try {
          const rawDistance = Math.min(distanceKm / this.scaleDistMax, 1.0);
          const rawSpeed = Math.min(speedKmh / this.scaleSpeedMax, 1.0);
          const rawHour = hour / this.scaleHourMax;

          const inputTensor = tf.tensor2d([[rawDistance, rawSpeed, rawHour]]);
          const outputTensor = this.model.predict(inputTensor);
          const normalizedResult = outputTensor.dataSync()[0];

          inputTensor.dispose();
          outputTensor.dispose();

          let predictedMinutes = normalizedResult * this.scaleTimeMax;
          if (predictedMinutes < 0.1 || isNaN(predictedMinutes)) {
            predictedMinutes = physicalMinutes;
          } else {
            predictedMinutes = Math.max(physicalMinutes * 0.3, Math.min(physicalMinutes * 3.5, predictedMinutes));
          }

          return {
            predictedMinutes: Math.round(predictedMinutes * 10) / 10,
            inferenceTimeMs: Math.round((performance.now() - startTime) * 10) / 10,
          };
        } catch (e) {
          return {
            predictedMinutes: Math.round(physicalMinutes * 10) / 10,
            inferenceTimeMs: Math.round((performance.now() - startTime) * 10) / 10,
          };
        }
      }
    }
    const aiModelService = new ETAInferenceModel();

    // --- CHART COMPONENT USING NATIVE CHART.JS (Phase 5 restored) ---
    function LossChart({ data }) {
      const canvasRef = React.useRef(null);
      const chartInstanceRef = React.useRef(null);

      React.useEffect(() => {
        if (!canvasRef.current || data.length === 0) return;

        const ctx = canvasRef.current.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 160);
        gradient.addColorStop(0, 'rgba(139, 92, 246, 0.4)');
        gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map(d => d.epoch),
            datasets: [{
              label: 'Loss',
              data: data.map(d => d.loss),
              borderColor: '#a78bfa',
              borderWidth: 2,
              backgroundColor: gradient,
              fill: true,
              tension: 0.1,
              pointRadius: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } },
              y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b' } }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [data]);

      return <div className="h-40 w-full"><canvas ref={canvasRef}></canvas></div>;
    }

    // --- VIEW COMPONENT: MODEL TRAINER (Phase 5 restored & updated trigger) ---
    function ModelTrainer({ onModelStatusChange, triggerPrediction, trainingSamplesCount, setTrainingSamplesCount }) {
      const [isExpanded, setIsExpanded] = React.useState(false); 
      const [epochs, setEpochs] = React.useState(60);
      const [lr, setLr] = React.useState(0.015);
      const [list, setList] = React.useState([]);
      const [status, setStatus] = React.useState({ state: "untrained", currentEpoch: 0, currentLoss: 0, lossHistory: [], msg: "お持ちの走行実績（ローカル履歴含む）でAIを自律学習させます。" });

      const loadData = async () => {
        const d = await dbService.getTrainingDatas();
        setList(d);
        setTrainingSamplesCount(d.length);
      };

      React.useEffect(() => { loadData(); }, []);

      const handleAddPresets = async () => {
        const pre = generatePresetTrainingData();
        for (let i = 0; i < 30; i++) {
          await dbService.addTrainingData(pre[i]);
        }
        await loadData();
      };

      const handleReset = () => {
        dbService.resetLocalData();
        loadData();
      };

      const handleTrain = async () => {
        if (list.length === 0) {
          alert("学習用データがありません。擬似走行実績ボタンを押して加算してください。");
          return;
        }

        const runStatus = { state: "training", currentEpoch: 0, currentLoss: 0, lossHistory: [], msg: "TensorFlow.jsによるバックプロパゲーション演算を開始..." };
        setStatus(runStatus);
        onModelStatusChange(runStatus);

        const history = [];
        try {
          await aiModelService.train(list, epochs, lr, (epoch, loss) => {
            const clean = Math.round(loss * 100000) / 100000;
            history.push({ epoch, loss: clean });
            const step = { state: "training", currentEpoch: epoch, currentLoss: clean, lossHistory: [...history], msg: `Epoch ${epoch}/${epochs} 損失演算: ${clean}` };
            setStatus(step);
            onModelStatusChange(step);
          });

          const ready = { state: "ready", currentEpoch: epochs, currentLoss: history[history.length - 1]?.loss || 0, lossHistory: history, msg: "モデル準備完了！到着ETAの非線形補正が自律稼働を開始しました。" };
          setStatus(ready);
          onModelStatusChange(ready);
          triggerPrediction();
        } catch (e) {
          const broken = { state: "untrained", currentEpoch: 0, currentLoss: 0, lossHistory: [], msg: "学習エラー。実績値を再精査してください。" };
          setStatus(broken);
          onModelStatusChange(broken);
        }
      };

      return (
        <div className="bg-slate-900 text-slate-100 rounded-2xl p-5 border border-slate-800 shadow flex flex-col gap-4">
          <div className="flex justify-between items-center border-b pb-3 border-slate-800 flex-wrap gap-2 cursor-pointer" onClick={() => setIsExpanded(!isExpanded)}>
            <div className="flex items-center gap-2">
              <div className="bg-violet-955 text-violet-400 p-2 rounded-xl"><Icons.Brain /></div>
              <div>
                <h4 className="font-bold text-slate-200 text-sm hover:text-violet-400 transition-colors">自律学習型ディープラーニング予測器</h4>
                <p className="text-[10px] text-slate-400">ニューラルネットワークが勾配降下法をブラウザ上で並列計算します</p>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <span className="text-[11px] font-mono bg-black text-slate-400 px-2 py-0.5 rounded border border-slate-800">実績走行ログ: {list.length}件</span>
              <span className="text-slate-400 text-xs font-bold">{isExpanded ? "▲ 閉じる" : "▼ 展開する"}</span>
            </div>
          </div>

          {isExpanded && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 pt-2 animate-fade-in">
              <div className="lg:col-span-5 bg-black p-4 rounded-xl border border-slate-800 flex flex-col gap-4 justify-between font-mono text-xs">
                <div className="flex flex-col gap-3">
                  <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">ハイパーパラメータ</span>
                  <div>
                    <div className="flex justify-between text-[11px]"><span>エポック数: {epochs}回</span></div>
                    <input type="range" min="10" max="150" step="10" value={epochs} onChange={e => setEpochs(Number(e.target.value))} disabled={status.state === "training"} className="w-full accent-violet-500" />
                  </div>
                  <div>
                    <div className="flex justify-between text-[11px]"><span>学習率 (Learning Rate): {lr}</span></div>
                    <input type="range" min="0.002" max="0.04" step="0.002" value={lr} onChange={e => setLr(Number(e.target.value))} disabled={status.state === "training"} className="w-full accent-violet-500" />
                  </div>
                </div>
                <div className="flex flex-col gap-2 pt-3 border-t border-slate-850">
                  <div className="flex gap-1">
                    <button onClick={handleAddPresets} disabled={status.state === "training"} className="flex-1 bg-slate-800 hover:bg-slate-700 p-1.5 rounded-lg text-[10px] font-bold">疑似実績蓄積 (+30件)</button>
                    <button onClick={handleReset} disabled={status.state === "training"} className="bg-slate-800 hover:bg-red-955 p-1.5 rounded-lg text-[10px] text-red-400 font-bold">リセット</button>
                  </div>
                  <button onClick={handleTrain} disabled={status.state === "training" || list.length === 0} className="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold p-2.5 rounded-xl text-center">
                    {status.state === "training" ? "学習進行中..." : "AIモデルの再学習を実行"}
                  </button>
                </div>
              </div>

              <div className="lg:col-span-7 bg-black/50 p-4 rounded-xl border border-slate-800 flex flex-col gap-2 min-h-[160px]">
                <span className="text-[10px] text-slate-500 font-mono tracking-wider font-bold">自律誤差収束モニター (Loss)</span>
                {status.lossHistory.length > 0 ? (
                  <LossChart data={status.lossHistory} />
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center text-center text-slate-500 text-[11px] font-sans">
                    データを入れたあと、再学習を実行するとロス収束グラフが動的に描かれます。
                  </div>
                )}
                <div className="text-[10px] font-mono text-slate-500 border-t border-slate-900 pt-1.5 truncate">
                  Status: {status.msg}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- VIEW COMPONENT: MAP (Phase 6 goals array version) ---
    function MapContainer({ goals, currentLat, currentLng, activeDeviceId }) {
      const mapRef = React.useRef(null);
      const markersRef = React.useRef({});
      const polylinesRef = React.useRef([]);

      const createCustomIcon = (type, label) => {
        let text = "G";
        let color = type === "current" ? "bg-black" : "bg-rose-600 animate-bounce";
        
        if (type === "current") {
          const html = `
            <div class="flex flex-col items-center justify-end h-full select-none" style="transform: translateY(-8px);">
              <div class="bg-black text-[10px] font-mono font-bold text-white px-2.5 py-1 rounded-lg border border-slate-700 shadow-xl whitespace-nowrap flex items-center gap-1.5 z-50">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
                <span>${label || "BUS"}</span>
              </div>
              <div class="w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-t-[6px] border-t-black -mt-[1px] mb-1"></div>
              <div class="relative flex items-center justify-center w-6 h-6">
                <span class="absolute inline-flex h-full w-full rounded-full bg-black opacity-35 animate-ping"></span>
                <div class="relative w-4.5 h-4.5 rounded-full bg-black border-2 border-white shadow-lg flex items-center justify-center">
                  <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                </div>
              </div>
            </div>
          `;
          return L.divIcon({ html, className: "custom-leaflet-icon", iconSize: [140, 70], iconAnchor: [70, 62] });
        }

        const html = `
          <div class="flex flex-col items-center select-none" style="transform: translateY(-16px);">
            <div class="bg-white text-[10px] font-bold text-rose-700 px-2 py-0.5 rounded border border-rose-200 shadow-sm whitespace-nowrap mb-1">
              ${label}
            </div>
            <div class="flex items-center justify-center w-8 h-8 rounded-full ${color} text-white border-2 border-white shadow-md font-bold text-sm">
              ${text}
            </div>
          </div>
        `;
        return L.divIcon({ html, className: "custom-leaflet-icon", iconSize: [100, 60], iconAnchor: [50, 48] });
      };

      React.useEffect(() => {
        const map = L.map("map-target", { center: [35.0, 137.1], zoom: 11 });
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: '&copy; OpenStreetMap' }).addTo(map);
        mapRef.current = map;
        return () => { map.remove(); };
      }, []);

      React.useEffect(() => {
        if (!mapRef.current) return;
        const map = mapRef.current;

        polylinesRef.current.forEach(p => map.removeLayer(p));
        polylinesRef.current = [];

        const bounds = [];

        if (currentLat && currentLng) {
          if (!markersRef.current['current']) {
            markersRef.current['current'] = L.marker([currentLat, currentLng], { icon: createCustomIcon("current", activeDeviceId) }).addTo(map);
          } else {
            markersRef.current['current'].setLatLng([currentLat, currentLng]);
            markersRef.current['current'].setIcon(createCustomIcon("current", activeDeviceId));
          }
          bounds.push([currentLat, currentLng]);
        }

        goals.forEach((goal, i) => {
          if(goal.lat && goal.lng) {
            if (!markersRef.current[`goal_${i}`]) {
              markersRef.current[`goal_${i}`] = L.marker([goal.lat, goal.lng], { icon: createCustomIcon("goal", goal.name) }).addTo(map);
            } else {
              markersRef.current[`goal_${i}`].setLatLng([goal.lat, goal.lng]);
              markersRef.current[`goal_${i}`].setIcon(createCustomIcon("goal", goal.name));
            }
            bounds.push([goal.lat, goal.lng]);

            if(currentLat && currentLng) {
              const line = L.polyline([[currentLat, currentLng], [goal.lat, goal.lng]], { 
                color: i === 0 ? "#0284c7" : "#8b5cf6", 
                weight: 4, dashArray: "4, 8", opacity: 0.8 
              }).addTo(map);
              polylinesRef.current.push(line);
            }
          }
        });

        if(bounds.length > 0) {
          map.fitBounds(L.latLngBounds(bounds), { padding: [50, 50], maxZoom: 14 });
        }
      }, [goals, currentLat, currentLng, activeDeviceId]);

      return (
        <div className="relative w-full h-[360px] rounded-xl overflow-hidden border border-slate-200 shadow-inner">
          <div id="map-target" class="w-full h-full grayscale-map"></div>
          <button onClick={() => {}} className="absolute bottom-4 right-4 z-[1000] bg-white hover:bg-slate-50 text-slate-800 p-2.5 rounded-lg shadow-lg border border-slate-200">
            <Icons.Compass />
          </button>
        </div>
      );
    }

    // --- MAIN CORE APPLICATION VIEW ---
    function App() {
      const [appConfig, setAppConfig] = React.useState(null);
      
      // Phase 6 States
      const [workplaceId, setWorkplaceId] = React.useState(localStorage.getItem("eta_workplace_id") || "");
      const [goals, setGoals] = React.useState([]);
      const [deviceList, setDeviceList] = React.useState([]);
      
      // GPS Data
      const [currentLat, setCurrentLat] = React.useState(null);
      const [currentLng, setCurrentLng] = React.useState(null);
      const [currentSpeed, setCurrentSpeed] = React.useState(0);
      const [measuredTime, setMeasuredTime] = React.useState("未取得");
      const [dbWriteTime, setDbWriteTime] = React.useState("未取得");
      const [freshness, setFreshness] = React.useState("計算中...");
      
      // App control
      const [connected, setConnected] = React.useState(false);
      const [lockedTargetDevice, setLockedTargetDevice] = React.useState(null);
      const [activeDeviceId, setActiveDeviceId] = React.useState("検索中...");
      const [manualDeviceId, setManualDeviceId] = React.useState(""); 
      const [showDevMenu, setShowDevMenu] = React.useState(false);
      const [gpsInterval, setGpsInterval] = React.useState(15);
      
      // AI & ETA State
      const [currentHour, setCurrentHour] = React.useState(new Date().getHours());
      const [predictions, setPredictions] = React.useState([]);
      const [showETA, setShowETA] = React.useState(true); // Default open
      const [showGuide, setShowGuide] = React.useState(false);
      const [tripAlert, setTripAlert] = React.useState(null);
      const [samples, setSamples] = React.useState(0);
      const [modelState, setModelState] = React.useState("untrained");

      React.useEffect(() => {
        fetch('./config.json')
          .then(res => res.json())
          .then(data => {
            setAppConfig(data);
            
            if (data.supabase && data.supabase.url && data.supabase.anonKey) {
              dbService.connect(data.supabase.url, data.supabase.anonKey).then(res => setConnected(res.success));
            }

            let targetWp = data.workplaces.find(w => w.id === workplaceId);
            if (!targetWp && data.workplaces.length > 0) {
              targetWp = data.workplaces[0];
            }
            if (targetWp) {
              setWorkplaceId(targetWp.id);
              setGoals(targetWp.goals || []);
              setDeviceList(targetWp.devices || []);
              localStorage.setItem("eta_workplace_id", targetWp.id);
            }
          })
          .catch(err => {
            alert("config.json の読み込みに失敗しました。ファイルが存在するか確認してください。");
          });
      }, []);

      const handleWorkplaceChange = (newId) => {
        const targetWp = appConfig.workplaces.find(w => w.id === newId);
        if (targetWp) {
          setWorkplaceId(targetWp.id);
          setGoals(targetWp.goals || []);
          setDeviceList(targetWp.devices || []);
          localStorage.setItem("eta_workplace_id", targetWp.id);
          setCurrentLat(null); setCurrentLng(null);
          setMeasuredTime("取得中..."); setFreshness("計算中...");
          setActiveDeviceId("検索中...");
        }
      };

      const triggerPrediction = () => {
        if (!currentLat || !currentLng || goals.length === 0) return;
        
        const preds = goals.map(goal => {
          const dist = getDistanceKm(currentLat, currentLng, goal.lat, goal.lng);
          const speed = Math.max(0.5, currentSpeed);
          const aiPred = aiModelService.predict(dist, speed, currentHour);
          return {
            name: goal.name,
            dist: dist,
            predictedMinutes: Math.round(aiPred.predictedMinutes * 10) / 10,
            inferenceTimeMs: aiPred.inferenceTimeMs
          };
        });
        setPredictions(preds);
      };

      React.useEffect(() => { triggerPrediction(); }, [currentLat, currentLng, currentSpeed, currentHour, goals, modelState]);

      // Phase 7: ① 探索してロックする処理（起動時・勤務地変更時・強制ID変更時のみ1回だけ実行）
      React.useEffect(() => {
        if (!connected || !appConfig) return;

        const determineDevice = async () => {
          const targets = manualDeviceId ? [manualDeviceId] : deviceList;
          const thresholdSec = appConfig.system_settings?.data_freshness_threshold_sec || 3600;
          let foundFresh = false;

          for (const targetId of targets) {
            try {
              const last = await dbService.getLatestGPSLog(targetId);
              if (last && last.created_at) {
                const logTime = new Date(last.created_at).getTime();
                const diffSec = (Date.now() - logTime) / 1000;

                if (diffSec <= thresholdSec) {
                  setLockedTargetDevice(targetId); // 追跡対象をロック
                  setActiveDeviceId(targetId);     // UI表示用
                  foundFresh = true;
                  break;
                }
              }
            } catch(e){}
          }

          if (!foundFresh && targets.length > 0) {
            const fallbackId = targets[0];
            setLockedTargetDevice(fallbackId); // 古くても強制ロック
            setActiveDeviceId(`${fallbackId} (過去データ)`);
            setFreshness("データ更新停止（閾値超過）");
          } else if (targets.length === 0) {
            setLockedTargetDevice(null);
            setActiveDeviceId("検索中...");
          }
        };
        
        determineDevice();
      }, [connected, deviceList, manualDeviceId, appConfig]);

      // Phase 7: ② 定期取得ポーリング処理（ロックされた端末だけを軽量に見に行く）
      React.useEffect(() => {
        if (!lockedTargetDevice) return;

        const syncGps = async () => {
          try {
            const last = await dbService.getLatestGPSLog(lockedTargetDevice);
            if (last) {
              setCurrentLat(last.latitude);
              setCurrentLng(last.longitude);
              setCurrentSpeed(last.speed_kmh);
              
              if (last.measured_at) {
                const cleanRaw = last.measured_at.split('.')[0].split('+')[0];
                setMeasuredTime(cleanRaw.replace('T', ' '));
              } else {
                setMeasuredTime("データなし");
              }
              
              if (last.created_at) {
                const jstDate = new Date(last.created_at).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
                setDbWriteTime(jstDate);
                
                const logTime = new Date(last.created_at).getTime();
                const diffSec = (Date.now() - logTime) / 1000;
                const thresholdSec = appConfig?.system_settings?.data_freshness_threshold_sec || 3600;
                
                if (diffSec > thresholdSec) {
                  setActiveDeviceId(`${lockedTargetDevice} (過去データ)`);
                  setFreshness("データ更新停止（閾値超過）");
                } else {
                  const diffMins = Math.floor(diffSec / 60);
                  setActiveDeviceId(lockedTargetDevice);
                  setFreshness(diffMins < 1 ? "1分未満" : `${diffMins}分前のデータ`);
                }
              } else {
                setDbWriteTime("データなし");
              }
            }
          } catch(e){}
        };
        
        syncGps();
        const timer = setInterval(syncGps, gpsInterval * 1000);
        return () => clearInterval(timer);
      }, [gpsInterval, lockedTargetDevice, appConfig]);

      const formatETA = (minsLeft) => {
        if(isNaN(minsLeft)) return "--:--";
        const d = new Date(); d.setSeconds(d.getSeconds() + minsLeft * 60);
        return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      };

      // Trip completion logic (Phase 5 restored)
      const handleTripComplete = async (actualMins) => {
        if(!currentLat || !goals[0]) return;
        const dist = getDistanceKm(currentLat, currentLng, goals[0].lat, goals[0].lng);
        const record = {
          distance_km: Math.round(dist * 100)/100,
          speed_kmh: Math.round(currentSpeed * 10)/10,
          hour: currentHour,
          actual_time_min: Math.round(actualMins * 10)/10
        };
        await dbService.addTrainingData(record);
        setTripAlert({ actual: record.actual_time_min, dist: record.distance_km });
        const list = await dbService.getTrainingDatas();
        setSamples(list.length);
      };

      if (!appConfig) {
        return <div className="flex h-screen items-center justify-center font-bold text-slate-500">システム設定を読み込み中...</div>;
      }

      return (
        <div className="flex flex-col gap-6">
          {/* Header (Phase 5 restored with Guide button) */}
          <div className="flex justify-between items-center gap-4 flex-wrap border-b pb-5 border-slate-200">
            <div>
              <h1 className="text-2xl font-extrabold flex items-center gap-2 text-slate-900 leading-none">
                到着時間予測 AI App <span className="text-[10px] bg-blue-600 text-white font-mono font-bold px-2 py-0.5 rounded-full">Phase 7</span>
              </h1>
              <p className="text-xs text-slate-500 mt-1.5 font-sans">100%ローカル稼働。勤務地ベースの自動経路セット・自動フォールバック推論機</p>
            </div>
            <div className="flex gap-2 font-mono">
              <button onClick={() => setShowGuide(true)} className="bg-blue-50 text-blue-650 hover:bg-blue-105 border px-3 py-1.5 rounded-xl font-sans font-bold text-xs flex items-center gap-1 shadow-sm">
                <Icons.HelpCircle /> 操作方法
              </button>
            </div>
          </div>

          {/* ▼ Phase 6：勤務地（ルート）選択パネル */}
          <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex flex-col gap-4">
            <div className="flex items-center gap-2 border-b pb-3 border-slate-100">
              <div className="bg-indigo-50 text-indigo-600 p-2 rounded-xl border"><Icons.MapPin /></div>
              <div>
                <h4 className="font-bold text-slate-800 text-sm">勤務地（ルート）の選択</h4>
                <p className="text-[11px] text-slate-500">選択した拠点のゴールと、対応するGPS追跡デバイスが自動的に設定されます。</p>
              </div>
            </div>
            <div>
              <select 
                value={workplaceId} 
                onChange={e => handleWorkplaceChange(e.target.value)} 
                className="w-full sm:w-1/2 p-3 bg-slate-50 border border-slate-300 rounded-xl cursor-pointer font-bold text-slate-800 shadow-sm hover:bg-white transition"
              >
                {appConfig.workplaces.map(wp => (
                  <option key={wp.id} value={wp.id}>{wp.name}</option>
                ))}
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 items-start">
            {/* Left Col */}
            <div className="xl:col-span-7 flex flex-col gap-6">
              
              {/* ▼ Phase 6：AI到着予測 (ETA) 補正出力（2ゴール並列表示）+ Phase 5 Accordion */}
              <div className="bg-white border text-slate-800 rounded-2xl p-6 shadow-sm relative overflow-hidden flex flex-col gap-4">
                <div className="flex justify-between items-center border-b pb-3.5 border-slate-100 cursor-pointer" onClick={() => setShowETA(!showETA)}>
                  <div className="flex items-center gap-1.5 text-indigo-600">
                    <Icons.Sparkles />
                    <h3 className="font-bold text-sm text-slate-800 hover:text-blue-600 transition-colors">AI到着予測 (ETA)</h3>
                  </div>
                  <span className="text-slate-400 text-xs font-bold">{showETA ? "▲ 閉じる" : "▼ 展開する"}</span>
                </div>

                {showETA && (
                  <div className="animate-fade-in flex flex-col gap-4">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {predictions.length > 0 ? predictions.map((pred, idx) => (
                        <div key={idx} className="bg-slate-50 border border-slate-200 p-4 rounded-xl flex flex-col gap-2 relative overflow-hidden shadow-sm">
                          <div className="absolute top-0 left-0 w-1.5 h-full" style={{backgroundColor: idx===0?"#0284c7":"#8b5cf6"}}></div>
                          <span className="text-[11px] text-slate-500 font-bold uppercase tracking-wider block pl-2">
                            {pred.name} へ向かう場合
                          </span>
                          <div className="flex items-baseline gap-2 pl-2">
                            <span className="text-4xl font-black bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent">
                              {formatETA(pred.predictedMinutes)}
                            </span>
                            <span className="text-sm font-bold text-slate-700">
                              ( 約<span className={`text-xl px-1 font-mono font-extrabold ${idx===0?'text-blue-600':'text-violet-600'}`}>{pred.predictedMinutes.toFixed(1)}</span>分 )
                            </span>
                          </div>
                          <div className="flex justify-between text-[10px] text-slate-400 font-mono pl-2 pt-2 border-t border-slate-200/60 mt-1">
                            <span>残り: {pred.dist.toFixed(2)} km</span>
                            <span>推論: {pred.inferenceTimeMs} ms</span>
                          </div>
                        </div>
                      )) : (
                        <div className="col-span-2 text-center text-slate-400 text-xs py-6">GPSデータを待機中...</div>
                      )}
                    </div>

                    {/* デバッグ検証用スライダー (Phase 5 restored) */}
                    <div className="bg-indigo-50/50 border border-indigo-100/50 p-3 rounded-xl flex flex-col gap-1.5">
                      <div className="flex justify-between text-xs text-indigo-955 font-bold">
                        <span className="flex items-center gap-1 font-sans"><Icons.Clock className="w-3.5 h-3.5 text-indigo-500" /> ラッシュ時AI推論特性のデバッグ検証</span>
                        <span className="font-mono">{currentHour} 時台</span>
                      </div>
                      <input type="range" min="0" max="23" value={currentHour} onChange={e => setCurrentHour(Number(e.target.value))} className="w-full accent-indigo-600" />
                      <p className="text-[10px] text-slate-500 mt-0.5 leading-relaxed">スライダーを朝（7〜9時）や夕方（17〜19時）に動かすと、再学習成果の非線形変化（ラッシュ遅延）をリアルタイムにシミュレートできます。</p>
                    </div>
                  </div>
                )}
              </div>

              {/* Current Location Data Panel */}
              <div className="bg-slate-900 text-white rounded-2xl p-5 border border-slate-800 shadow-md flex flex-col gap-3">
                <div className="flex items-center justify-between border-b border-slate-700 pb-2.5 flex-wrap gap-2">
                  <div className="flex items-center gap-2">
                    <span className="text-emerald-400"><Icons.Activity /></span>
                    <h3 className="font-bold text-sm tracking-wider flex items-center">現在地最新データ</h3>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="text-[11px] font-mono tracking-tighter text-slate-400">鮮度：{freshness}</span>
                    {connected ? (
                      <span className="text-[10px] bg-emerald-955 text-emerald-400 border border-emerald-800 px-2 py-1 rounded-full font-mono animate-pulse">DB接続中</span>
                    ) : (
                      <span className="text-[10px] bg-rose-955 text-rose-400 border border-rose-800 px-2 py-1 rounded-full font-mono">DB切断</span>
                    )}
                  </div>
                </div>
                
                <div className="flex flex-col gap-1 mb-2">
                  <span className="text-slate-400 text-[10px]">現在採用中のデバイス (フォールバック結果)</span>
                  <span className="font-mono text-sm font-bold text-sky-400">{activeDeviceId}</span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 font-mono text-xs">
                  <div className="flex flex-col gap-1 bg-black/40 p-2.5 rounded-lg border border-slate-800">
                    <span className="text-slate-500 text-[10px]">計測時間</span>
                    <span className="font-bold text-slate-200">{measuredTime}</span>
                  </div>
                  <div className="flex flex-col gap-1 bg-black/40 p-2.5 rounded-lg border border-slate-800">
                    <span className="text-slate-500 text-[10px]">車速</span>
                    <span className="font-bold text-emerald-300">{Math.round(currentSpeed)} km/h</span>
                  </div>
                  <div className="flex flex-col gap-1 bg-black/40 p-2.5 rounded-lg border border-slate-800">
                    <span className="text-slate-500 text-[10px]">緯度 (Lat)</span>
                    <span className="font-bold text-slate-200">{currentLat ? currentLat.toFixed(6) : "---"}</span>
                  </div>
                  <div className="flex flex-col gap-1 bg-black/40 p-2.5 rounded-lg border border-slate-800">
                    <span className="text-slate-500 text-[10px]">経度 (Lng)</span>
                    <span className="font-bold text-slate-200">{currentLng ? currentLng.toFixed(6) : "---"}</span>
                  </div>
                </div>
              </div>

              {/* Leaflet Map Card */}
              <div className="bg-white rounded-2xl p-4 border border-slate-200/85 shadow-sm flex flex-col gap-4">
                <div className="flex justify-between items-center pb-2.5 border-b border-slate-100">
                  <h4 className="font-bold text-slate-800 text-sm flex items-center">
                    <span className="text-blue-500 mr-2"><Icons.Compass /></span> 路線リアルタイムマップ
                  </h4>
                </div>
                <MapContainer
                  goals={goals}
                  currentLat={currentLat} currentLng={currentLng}
                  activeDeviceId={activeDeviceId}
                />
              </div>
            </div>

            {/* Right Col: Admin/Dev Tools & Model Trainer */}
            <div className="xl:col-span-5 flex flex-col gap-6">
              
              {/* ▼ Phase 6：開発者向け強制オーバーライドメニュー */}
              <div className="bg-slate-100 rounded-2xl p-5 border border-slate-300 border-dashed shadow-inner flex flex-col gap-4">
                <div className="flex justify-between items-center border-b pb-3 border-slate-300 cursor-pointer" onClick={() => setShowDevMenu(!showDevMenu)}>
                  <div className="flex items-center gap-2">
                    <div className="text-slate-600"><Icons.Settings /></div>
                    <div>
                      <h4 className="font-bold text-slate-800 text-sm">開発者メニュー</h4>
                      <p className="text-[10px] text-slate-500">デバッグ・強制デバイス追跡</p>
                    </div>
                  </div>
                  <span className="text-slate-400 text-xs font-bold">{showDevMenu ? "▲" : "▼"}</span>
                </div>

                {showDevMenu && (
                  <div className="flex flex-col gap-4 pt-2 animate-fade-in font-mono text-xs">
                    <div className="flex flex-col gap-1.5">
                      <span className="font-bold text-slate-700">強制デバイスID上書き</span>
                      <p className="text-[10px] text-slate-500 font-sans leading-tight">
                        入力した場合、勤務地設定と鮮度フォールバックを無視してこのデバイスのみを追跡します。（※リロードで元に戻ります）
                      </p>
                      <input 
                        type="text" 
                        placeholder="例: test99" 
                        value={manualDeviceId} 
                        onChange={e => setManualDeviceId(e.target.value)} 
                        className="p-2.5 bg-white border border-slate-300 rounded-lg w-full mt-1 focus:outline-blue-500"
                      />
                    </div>
                    
                    <div className="flex flex-col gap-1.5 pt-3 border-t border-slate-300">
                      <span className="font-bold text-slate-700">ポーリング設定</span>
                      <select value={gpsInterval} onChange={e => setGpsInterval(Number(e.target.value))} className="p-2 bg-white border border-slate-300 rounded-lg">
                        <option value={5}>5秒間隔で取得</option>
                        <option value={15}>15秒間隔で取得</option>
                        <option value={60}>60秒間隔で取得</option>
                      </select>
                    </div>
                  </div>
                )}
              </div>

              {/* Neural network Deep learning component (Phase 5 restored) */}
              <ModelTrainer
                onModelStatusChange={s => setModelState(s.state)}
                triggerPrediction={triggerPrediction}
                trainingSamplesCount={samples}
                setTrainingSamplesCount={setSamples}
              />
            </div>
          </div>

          {/* Guide Modal Operation Manual Dialog (Phase 5 restored) */}
          {showGuide && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[2500] p-4 text-left">
              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl border flex flex-col p-6 animate-fade-in text-slate-800 relative select-none">
                <div className="flex justify-between items-center pb-3 border-b border-indigo-50">
                  <h3 className="font-extrabold text-lg text-slate-900">到着予測 AI App ユーザー操作ガイド</h3>
                  <button onClick={() => setShowGuide(false)} className="text-slate-400 font-mono text-sm hover:text-slate-700">✕</button>
                </div>
                <div className="py-4 flex flex-col gap-3 text-xs leading-relaxed max-h-[400px] overflow-y-auto">
                  <div className="font-bold text-indigo-600 bg-indigo-50/50 p-2.5 rounded-lg border border-indigo-100">AIの予測精度は学習データに依存します。ローカルでの自律学習をお試しください。</div>
                  <p><b>1. 勤務地(ルート)の設定:</b> トップ画面から対象の工場等を選ぶと、自動的に該当するゴール座標と追跡対象デバイスがセットされます。</p>
                  <p><b>2. デバイスの鮮度検知:</b> 選択された勤務地に紐づくメインデバイスの通信が1時間以上途絶えた場合、自動的にサブデバイスへとフォールバックします。</p>
                  <p><b>3. AIモデルの学習:</b> 右下の「再学習の実行」を押すと、それまでの走行実績を機械がその場で学習(ミニバックプロパゲーション演算)し、朝夕ラッシュの複雑な遅延の重みを習得します。</p>
                  <p><b>4. 非線形性の検証:</b> 学習完了後、ETAパネルの「デバッグスライダー」を朝(8時台)や夕方(18時台)に動かします。AIが独自の遅延を加算算出しているのが確認できます。</p>
                </div>
                <button onClick={() => setShowGuide(false)} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-2 px-4 rounded-xl text-center shadow-sm">了解しました</button>
              </div>
            </div>
          )}

          {/* Completion Alerts Toast (Phase 5 restored) */}
          {tripAlert && (
            <div className="fixed inset-0 bg-slate-900/65 backdrop-blur-sm flex items-center justify-center z-[3000] p-4 select-none">
              <div className="bg-white rounded-2xl text-center p-6 border max-w-sm w-full flex flex-col gap-4 animate-bounce">
                <span className="text-3xl">🎉</span>
                <h4 className="font-black text-slate-900 text-lg">目的地（ゴール）に到着しました！</h4>
                <p className="text-xs text-slate-500 leading-relaxed font-mono">
                  走行距離: {tripAlert.dist} km<br />
                  実稼働所要時間: {tripAlert.actual} 分
                </p>
                <p className="text-[11px] text-indigo-650 bg-indigo-50 border p-2.5 rounded-lg">今回の走行条件が、今後の時間予測モデルを微調整するためのデータ実績としてブラウザ学習ハブへ自動記憶されました！</p>
                <button onClick={() => setTripAlert(null)} className="bg-blue-650 text-white font-bold p-2 rounded-xl text-sm">閉じる</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // mount React Element
    const rootEl = ReactDOM.createRoot(document.getElementById('root'));
    rootEl.render(<App />);

  </script>
</body>
</html>
